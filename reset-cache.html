<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>キャッシュ解除</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Yu Gothic",sans-serif;padding:30px;text-align:center}
button{font-size:22px;padding:18px 30px;border-radius:14px}
#msg{margin-top:20px;font-weight:bold}
</style>
</head>
<body>
<h1>ちゃいろのこびん キャッシュ解除</h1>
<button id="reset">キャッシュを解除する</button>
<div id="msg"></div>
<script>
document.getElementById("reset").addEventListener("click", async () => {
  const msg = document.getElementById("msg");
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ("caches" in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    msg.textContent = "解除できました。先生画面を開き直してください。";
  } catch (e) {
    msg.textContent = "解除中にエラー: " + e;
  }
});
</script>
</body>
</html>
